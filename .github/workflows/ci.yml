name: Validate PI app

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run crosswalk tests
        run: npm test

      - name: Build production frontend
        run: npm run build

      - name: Check server syntax
        run: node --check server/index.js && node --check server/db.js && node --check server/ai-provider-bootstrap.js
